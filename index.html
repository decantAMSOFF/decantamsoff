<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>decantAMS | Cyber Edition</title>
  <style>
    /* Estilos Base - Cyberpunk / Neón Dark */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #050508;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    /* Pantalla de Bienvenida (Intro con Logo) */
    #pantalla-intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(2, 2, 5, 0.96);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .logo-intro-container {
      position: relative;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }

    /* Luz LED alrededor del logo con animación de colores */
    .logo-intro-container img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 50%;
      position: relative;
      z-index: 2;
      animation: latido 2s infinite ease-in-out;
      filter: drop-shadow(0 0 15px #00f3ff);
      transition: transform 0.3s ease;
    }

    .logo-intro-container:hover img {
      transform: scale(1.08);
    }

    /* Efecto de brillo LED RGB aleatorio alrededor */
    .logo-intro-container::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(45deg, #00f3ff, #bc13fe, #ff0055, #00ff66);
      background-size: 400% 400%;
      z-index: 1;
      filter: blur(25px);
      opacity: 0.8;
      animation: rgbGlow 6s infinite linear;
    }

    @keyframes rgbGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes latido {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .texto-intro {
      margin-top: 25px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px #bc13fe;
      animation: parpadeoText 1.5s infinite alternate;
    }

    @keyframes parpadeoText {
      0% { opacity: 0.6; }
      100% { opacity: 1; text-shadow: 0 0 20px #00f3ff, 0 0 30px #00f3ff; }
    }

    /* Ocultar intro al hacer clic */
    .ocultar-intro {
      opacity: 0;
      visibility: hidden;
    }

    /* Estilos del Sitio Web Principal */
    header {
      background: rgba(5, 5, 8, 0.95);
      border-bottom: 2px solid #00f3ff;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    header h1 {
      color: #fff;
      font-size: 2rem;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
    }

    nav {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      color: #b0b0b0;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      color: #bc13fe;
      text-shadow: 0 0 8px #bc13fe;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(180deg, rgba(188, 19, 254, 0.1) 0%, rgba(5, 5, 8, 1) 100%);
      border-bottom: 1px solid #222;
    }

    .hero h2 {
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 0 0 8px rgba(188, 19, 254, 0.6);
    }

    .hero p {
      color: #888;
      font-size: 0.95rem;
    }

    section {
      padding: 30px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.5rem;
      color: #00f3ff;
      margin-bottom: 20px;
      border-left: 4px solid #00f3ff;
      padding-left: 10px;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    .productos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: #0d0d12;
      border: 1px solid #1f1f2e;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .card:hover {
      border-color: #bc13fe;
      box-shadow: 0 0 20px rgba(188, 19, 254, 0.4);
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      margin-bottom: 15px;
      filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8));
    }

    .card h3 {
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .badge-familia {
      display: inline-block;
      background: rgba(0, 243, 255, 0.1);
      color: #00f3ff;
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      margin-bottom: 12px;
    }

    .btn-agregar {
      background: transparent;
      color: #00f3ff;
      border: 2px solid #00f3ff;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
    }

    .btn-agregar:hover {
      background: #00f3ff;
      color: #050508;
      box-shadow: 0 0 20px #00f3ff;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE BIENVENIDA / INTRO CON LOGO -->
  <div id="pantalla-intro" onclick="entrarTienda()">
    <div class="logo-intro-container">
      <!-- AQUÍ PUEDES CAMBIAR EL ENLACE DE TU LOGO -->
      <img src="https://i.postimg.cc/P5g7t3mc/Perryellislove.png" alt="decantAMS Logo">
    </div>
    <div class="texto-intro">
      ⚡ Toca el logo para entrar al inicio ⚡
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL DE LA WEB -->
  <header>
    <h1>decantAMS</h1>
    <nav>
      <a href="#catalogo">Catálogo</a>
      <a href="#gorras">Gorras</a>
      <a href="#carrito">Carrito (0)</a>
    </nav>
  </header>

  <div class="hero">
    <h2>SISTEMA CYBERPUNK ACTIVO</h2>
    <p>⚡ Fragancias exclusivas y streetwear de alta gama ⚡</p>
  </div>

  <section id="catalogo">
    <h2 class="section-title">Perfumes / Decants</h2>
    <div class="productos-grid">
      
      <div class="card">
        <img src="https://i.postimg.cc/P5g7t3mc/Perryellislove.png" alt="Perry Ellis Love">
        <h3>Perry Ellis Love</h3>
        <span class="badge-familia">Floral</span>
        <button class="btn-agregar">Agregar al Carrito</button>
      </div>

    </div>
  </section>

  <script>
    function entrarTienda() {
      const intro = document.getElementById('pantalla-intro');
      intro.classList.add('ocultar-intro');
    }
  </script>

</body>
</html>
